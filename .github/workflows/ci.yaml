name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l api internal cmd)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -coverprofile=cover.out

  manifests:
    name: Manifests up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Generate manifests and code
        run: |
          make manifests generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'make manifests generate' and commit."
            git --no-pager diff
            exit 1
          fi

  images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify the operator image builds (UBI9 go-toolset builder + ubi-minimal
      # runtime). Not pushed.
      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: palworld-operator:ci
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

      # Verify the game server image builds (UBI9 + SteamCMD + static tini/rclone).
      # The context is the build dir so the COPYed scripts resolve. Not pushed.
      - name: Build game server image
        uses: docker/build-push-action@v6
        with:
          context: build/palworld-server
          file: build/palworld-server/Dockerfile
          platforms: linux/amd64
          push: false
          tags: palworld-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
