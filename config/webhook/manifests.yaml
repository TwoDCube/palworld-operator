---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-palworld-twodcube-io-v1alpha1-palworldgame
  failurePolicy: Fail
  name: vpalworldgame.kb.io
  rules:
  - apiGroups:
    - palworld.twodcube.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - palworldgames
  sideEffects: None
