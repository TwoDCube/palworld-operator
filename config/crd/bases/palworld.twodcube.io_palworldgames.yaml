                    default: 8211
                    description: GamePort is the UDP port the server listens on for
                      gameplay traffic.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  loadBalancerClass:
                    description: LoadBalancerClass selects a specific load balancer
