                  the operator creates and manages a dedicated ServiceAccount.
                type: string
              shutdown:
                description: |-
                  Shutdown configures the countdown players are given before the server
                  stops. Applies to every termination, not just updates.
                properties:
                  warnIntervalSeconds:
                    default: 60
                    description: |-
                      WarnIntervalSeconds is how often the countdown is re-broadcast while
                      WarnSeconds runs down. The default warns once a minute, so players who
                      joined mid-countdown or missed the first message still see one.
                    format: int32
                    minimum: 1
                    type: integer
                  warnMessage:
                    default: Server is shutting down for maintenance in %s
                    description: |-
                      WarnMessage is broadcast on every countdown tick. "%s" is replaced with a
                      human-readable remaining time ("5 minutes", "1 minute", "30 seconds") and
                      "%d" with the remaining whole seconds. Both may be used; neither is
                      required.
                    type: string
                  warnSeconds:
                    default: 300
                    description: |-
                      WarnSeconds is how long players are warned before the world is flushed and
                      the server stops. 0 stops immediately after a single announcement.

                      Because the countdown consumes the pod's termination grace period, raising
                      this also raises the derived TerminationGracePeriodSeconds.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              sidecars:
                description: |-
                  Sidecars are additional containers to run alongside the server (e.g. a
                  custom exporter or log shipper).
                items:
                  description: A single application container that you want to run
                    within a pod.
                  properties:
                    args:
                      description: |-
                        Arguments to the entrypoint.
                        The container image's CMD is used if this is not provided.
                        Variable references $(VAR_NAME) are expanded using the container's environment. If a variable
                        cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will
                        produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless
                        of whether the variable exists or not. Cannot be updated.
                        More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    command:
                      description: |-
                        Entrypoint array. Not executed within a shell.
                        The container image's ENTRYPOINT is used if this is not provided.
                        Variable references $(VAR_NAME) are expanded using the container's environment. If a variable
                        cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will
                        produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless
                        of whether the variable exists or not. Cannot be updated.
                        More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    env:
                      description: |-
                        List of environment variables to set in the container.
                        Cannot be updated.
                      items:
                        description: EnvVar represents an environment variable present
                          in a Container.
                        properties:
                          name:
                            description: Name of the environment variable. Must be
                              a C_IDENTIFIER.
                            type: string
                          value:
                            description: |-
                              Variable references $(VAR_NAME) are expanded
                              using the previously defined environment variables in the container and
                              any service environment variables. If a variable cannot be resolved,
                              the reference in the input string will be unchanged. Double $$ are reduced
                              to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                              "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
