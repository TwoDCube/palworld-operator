                    description: |-
                      WarnIntervalSeconds is how often WarnMessage is re-broadcast while the drain
                      runs down. Kept separate from ShutdownPolicy.WarnIntervalSeconds because the
                      two cover different phases (waiting for players to leave vs. counting down a
                      termination already under way) and operators may well want different
                      cadences.
                    format: int32
                    minimum: 1
                    type: integer
                  warnMessage:
                    default: Server will restart for updates in %d seconds
                    description: |-
                      WarnMessage is broadcast to players before an update restart. It may
                      contain "%d" which is replaced with the seconds left in the drain.
                    type: string
                type: object
              version:
                default: latest
                description: |-
                  Version pins the Steam build id of the Palworld dedicated server (Steam
                  app 2394010). Use "latest" to always track the newest public build; the
                  exact rollout behavior is governed by UpdatePolicy.
                type: string
            type: object
          status:
            description: PalworldGameStatus defines the observed state of a Palworld
              dedicated server.
            properties:
              availableVersion:
                description: |-
                  AvailableVersion is the newest Steam build id detected by the update
                  poller, when known.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecret:
                description: |-
                  CredentialsSecret is the Secret holding the (possibly generated) server
                  passwords.
                type: string
              currentNode:
                description: |-
                  CurrentNode is the node the server pod is currently scheduled on. It is
                  used to react to that node being cordoned/drained.
                type: string
              currentVersion:
                description: |-
                  CurrentVersion is the Steam build id currently installed/running. It is
                  managed solely by the update controller so it stays comparable with
                  AvailableVersion (both are Steam build ids).
                type: string
              gameEndpoint:
                description: GameEndpoint is the in-cluster/external address for the
                  game UDP port.
                type: string
              lastBackupName:
                description: LastBackupName is the name of the most recent successful
                  PalworldBackup.
                type: string
              lastBackupTime:
                description: |-
                  LastBackupTime is the completion time of the most recent successful
                  backup.
                format: date-time
                type: string
              lastUpdateTime:
                description: LastUpdateTime is when the server was last updated to
                  a new build.
                format: date-time
                type: string
              maxPlayers:
                description: MaxPlayers is the configured player capacity.
                format: int32
                type: integer
              nextScheduledBackup:
                description: NextScheduledBackup is when the next scheduled backup
                  will run.
                format: date-time
                type: string
              nextScheduledUpdateCheck:
                description: |-
                  NextScheduledUpdateCheck is when the operator will next poll Steam for a
                  new build.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              persistentVolumeClaim:
                description: PersistentVolumeClaim is the name of the bound world-data
                  PVC.
                type: string
              phase:
                description: Phase is a coarse, human-friendly lifecycle indicator.
                enum:
                - Pending
                - Installing
                - Running
                - Updating
                - BackingUp
                - Restoring
                - Stopped
                - Degraded
                - Terminating
                type: string
              playersOnline:
                description: PlayersOnline is the number of connected players (from
                  the REST API).
                format: int32
                type: integer
              replicas:
                description: Replicas is the number of running server pods (0 or 1).
                format: int32
                type: integer
              restEndpoint:
                description: RESTEndpoint is the in-cluster address of the REST admin
                  API.
                type: string
              routeURL:
                description: RouteURL is the external URL of the REST API Route, when
                  created.
                type: string
              selector:
                description: Selector is the serialized label selector for the scale
                  subresource.
                type: string
              serverName:
                description: ServerName is the in-game server name currently applied.
                type: string
              serverVersion:
                description: |-
                  ServerVersion is the human-readable in-game version reported by the REST
                  API (e.g. "v0.3.5"). Display only; not used for update comparisons.
                type: string
              updateDrainLastWarnTime:
                description: |-
                  UpdateDrainLastWarnTime is when the drain warning was last broadcast. The
                  controller is reconciled far more often than its own RequeueAfter, so
                  re-broadcasts are gated on this timestamp instead of on reconcile entry --
                  otherwise every reconcile would spam another chat message.
                format: date-time
                type: string
              updateDrainStartTime:
                description: |-
                  UpdateDrainStartTime is when the pre-update player drain began, and doubles
                  as the "a drain is in progress" flag. The reconciler cannot block, so the
                  drain is a requeue loop and its deadline has to survive in status. Cleared
                  once the pod is restarted or the pending update goes away.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
