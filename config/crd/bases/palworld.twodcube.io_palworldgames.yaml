                        type: boolean
                      tls:
                        default: edge
                        description: TLS selects the Route TLS termination policy.
                        enum:
                        - edge
                        - reencrypt
                        - passthrough
                        type: string
                    type: object
                  serviceAnnotations:
                    additionalProperties:
                      type: string
                    description: |-
