# OpenShift deployment overlay.
#
# The operator auto-detects OpenShift at runtime (via the Route API) and:
#   * omits explicit UID/GID/fsGroup on game pods so the restricted-v2 SCC can
#     inject them (the bundled server image is arbitrary-UID compatible), and
#   * creates OpenShift Routes for the REST API when requested.
#
# The bundled server image runs cleanly under the default restricted-v2 SCC, so
# no custom SecurityContextConstraints is required. If your cluster has a
# hardened restricted-v2, apply the optional SCC in ../scc.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../default

# [IMAGESTREAM TRIGGER] When the operator image is built in-cluster (`oc
# new-build --binary --name=palworld-operator`) rather than pulled from a
# registry, uncomment the next two lines. Each completed build then rolls the
# manager automatically, onto a digest rather than a mutable tag. Left off by
# default because it is inert unless an ImageStream named `palworld-operator`
# exists in the operator's namespace. See spec 10.
#patches:
#- path: imagestream-trigger.yaml
#  target:
#    kind: Deployment
#    name: palworld-operator-controller-manager
