apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: palworld-operator
    app.kubernetes.io/managed-by: kustomize
    # Enforce the restricted Pod Security Standard on the operator namespace.
    pod-security.kubernetes.io/enforce: restricted
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: palworld-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --metrics-secure
        image: controller:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # OPERATOR_IMAGE is used for the metrics-exporter sidecar; kept in sync
        # with the manager image by a kustomize replacement in config/default.
        - name: OPERATOR_IMAGE
          value: controller:latest
        - name: DEFAULT_SERVER_IMAGE
          value: quay.io/twodcube/palworld-server:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - "ALL"
        ports:
        - name: metrics
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            # Sized against the label-scoped informer cache (see
            # operatorCacheOptions in cmd/main.go), with headroom for the
            # deliberately unfiltered Node informer on large clusters. The
            # initial LIST is the memory peak, not the steady state — the
            # previous 256Mi was enough for steady state and still OOMKilled the
            # manager seconds after startup.
            memory: 512Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
